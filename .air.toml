root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/server"
  cmd = "go build -o ./tmp/server ./cmd/server"
  delay = 1000
  exclude_dir = ["bin", "tmp", "vendor", "deployments", "api", "docs"]
  exclude_regex = ["_test\\.go$", ".*_mock\\.go$"]
  include_ext = ["go", "toml", "yaml", "sql"]
  kill_delay = "0.5s"
  send_interrupt = true

[log]
  time = true

[misc]
  clean_on_exit = true
